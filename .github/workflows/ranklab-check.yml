name: RankLab release checks

on:
  push:
  pull_request:

jobs:
  static-release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-integration.txt

      - name: Install integration dependencies
        run: python -m pip install -r requirements-integration.txt

      - name: Run publishable RankLab checks
        run: make ranklab-check PYTHON=python
